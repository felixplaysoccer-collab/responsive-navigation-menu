<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu Exercise</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f6fc;
        }

        .topnav {
            background-color: #14213D;
            overflow: hidden;
            position: relative;
        }

        .topnav a {
            float: left;
            display: block;
            color: #FFF4CC;
            text-align: center;
            padding: 14px 18px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: #334155;
            color: #FFF4CC;
        }

        .topnav a.active {
            background-color: #5B21B6;
            color: #FFF4CC;
        }

        .topnav .icon {
            display: none;
        }

        .content {
            padding: 20px;
        }

        @media screen and (max-width: 650px) {
            .topnav a:not(:first-child) {
                display: none;
            }

            .topnav button.icon {
                float: right;
                display: block;
                background-color: #14213D;
                color: #FFF4CC;
                padding: 14px 18px;
                border: none;
                font-size: 17px;
                cursor: pointer;
            }

            .topnav.responsive a {
                float: none;
                display: block;
                text-align: left;
            }

            .topnav.responsive button.icon {
                position: absolute;
                right: 0;
                top: 0;
            }
        }
    </style>
</head>

<body>

    <div class="topnav" id="myTopnav">
        <a href="#home" class="active">Home</a>
        <a href="#news">News</a>
        <a href="#contact">Contact</a>
        <a href="#about">About</a>

        <button class="icon" onclick="myFunction()"
                aria-label="Toggle navigation menu"
                aria-expanded="false">
            &#9776;
        </button>
    </div>

    <div class="content">
        <h1>My Responsive Navigation Menu</h1>

        <p>Welcome to my INFOST 320 responsive menu exercise.</p>

        <p>Resize your browser window to see the menu change.</p>

        <p>When the screen width is 650 pixels or smaller,
        the navigation menu changes into an expandable button.</p>
    </div>

    <script>
        function myFunction() {
            let menu = document.getElementById("myTopnav");
            let button = menu.querySelector(".icon");

            if (menu.className === "topnav") {
                menu.className = "topnav responsive";
                button.setAttribute("aria-expanded", "true");
            } else {
                menu.className = "topnav";
                button.setAttribute("aria-expanded", "false");
            }
        }
    </script>

</body>
</html>
